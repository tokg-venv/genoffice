[package]
name = "win-clipboard-helper"
version = "0.1.0"
edition = "2024"
description = "Windows clipboard helper: EMF + OLE embedding for copies, and the OLE server for embedded-object activation"

[[bin]]
name = "win-clipboard-helper"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cfb = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
